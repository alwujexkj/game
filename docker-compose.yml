services:
  postgres:
    image: postgres:16-alpine
    container_name: sujia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sujia
      POSTGRES_PASSWORD: sujia
      POSTGRES_DB: sujia_park
    ports:
      - "5432:5432"
    volumes:
      - sujia_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sujia -d sujia_park"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sujia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - sujia_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sujia_pg_data:
  sujia_redis_data:
